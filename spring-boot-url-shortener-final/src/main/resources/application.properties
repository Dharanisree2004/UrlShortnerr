spring.application.name=spring-boot-url-shortener



# Disable Docker Compose lifecycle management
#spring.docker.compose.enabled=false

### App Config
app.base-url=http://localhost:8080
app.default-expiry-in-days=30
app.validate-original-url=true
app.page-size=10

# MySQL Configuration (updated)
spring.datasource.url=jdbc:mysql://mysql:3306/urlshortener
spring.datasource.username=user
spring.datasource.password=password

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

