services:
  mysql:
    image: 'mysql:8'
    environment:
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'MYSQL_DATABASE=urlshortener'
      - 'MYSQL_USER=user'
      - 'MYSQL_PASSWORD=password'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network  # Make sure this matches the network name defined below

volumes:
  mysql_data:

networks:
  app-network:  # Define the custom network
